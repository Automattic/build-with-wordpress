name: Build With WordPress Developer Docs Agent

on:
  workflow_dispatch:
    inputs:
      run_kind:
        description: Documentation run mode
        required: false
        default: maintenance
        type: choice
        options:
          - maintenance
          - bootstrap
  push:
    branches:
      - trunk

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: developer-docs-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  developer-docs-agent:
    name: Maintain Developer Docs
    uses: Automattic/docs-agent/.github/workflows/maintain-docs.yml@be109aaa1d5b11b37b919351981ed37ca3195446
    with:
      audience: technical
      run_kind: ${{ github.event.inputs.run_kind || 'maintenance' }}
      require_pr: ${{ github.event_name == 'workflow_dispatch' }}
      base_ref: test/docs-agent-bootstrap-acceptance-20260720-v2
      docs_branch: docs-agent/bootstrap-acceptance-20260720-v2-output
      writable_paths: README.md,docs/**
      bootstrap_contract: |
        {
          "required_paths": ["README.md", "docs/README.md"],
          "required_globs": [{"pattern": "docs/**/*.md", "min_count": 3}],
          "entry_points": [{"path": "README.md", "must_link_to": ["docs/README.md"]}]
        }
      source_delta: |
        [
          {
            "id": "figma-studio-handoff-diagnostics",
            "source_refs": [
              "https://github.com/Automattic/build-with-wordpress/pull/100",
              "plugins/figma-to-wordpress-studio/src/payload.ts",
              "plugins/figma-to-wordpress-studio/src/ui.ts",
              "plugins/figma-to-wordpress-studio/tests/generate-artifact.test.mjs"
            ],
            "requires_documentation_change": false
          }
        ]
      verification_commands: |
        [
          "pnpm install --frozen-lockfile",
          "pnpm build",
          "pnpm verify"
        ]
      validation_dependencies: npm install --global pnpm@10.8.1
      drift_checks: |
        [
          {
            "command": "git diff --exit-code -- . ':(top,exclude)README.md' ':(top,glob,exclude)docs/**' ':(top,glob,exclude)plugins/**/README.md'",
            "description": "Generated package outputs outside developer documentation are committed after build"
          }
        ]
      prompt: |
        Bootstrap the intentionally empty Build with WordPress developer documentation surface.

        Create `docs/README.md` as the documentation index plus at least `docs/architecture.md` and `docs/contributor-workflows.md`. Ground these pages in repository source, package manifests, workflows, tests, and plugin code. Cover the repository purpose, package layout, generated plugin artifacts, build and verification commands, skill packaging, Studio integration points, and contributor workflows.

        Update the root `README.md` to link to `docs/README.md`. Use the workspace write tools to create the required pages, then inspect `workspace_git_status` and `workspace_git_diff` before finishing with concise normal prose.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTERNAL_PACKAGE_SOURCE_POLICY: ${{ secrets.EXTERNAL_PACKAGE_SOURCE_POLICY }}
