name: CI

on:
  pull_request:
  push:
    branches:
      - trunk
      - feat/native-docs-agent

permissions:
  contents: read

jobs:
  validate:
    name: Test, Build, and Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Automattic/docs-agent
          ref: 5302ef41556e7f681e1f1c95a9a3f37f3db4a9dc
          path: .producer/docs-agent
      - uses: actions/checkout@v4
        with:
          repository: Automattic/wp-codebox
          ref: 65cc5fb4699cb7c2df13d04b4715c97097ac7565
          path: .producer/wp-codebox
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: rhysd/actionlint@v1.7.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DOCS_AGENT_DIR: ${{ github.workspace }}/.producer/docs-agent
          WP_CODEBOX_DIR: ${{ github.workspace }}/.producer/wp-codebox
      - run: pnpm build
      - run: pnpm verify
