name: CI

on:
  pull_request:
  push:
    branches:
      - trunk
      - feat/native-docs-agent

permissions:
  contents: read

jobs:
  validate:
    name: Test, Build, and Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Automattic/docs-agent
          ref: a39d9db230eb9e0b72ed84465f4d61bd8dda1bab
          path: .producer/docs-agent
      - uses: actions/checkout@v4
        with:
          repository: Automattic/wp-codebox
          ref: 12a5bb19a97b89d0a78b502fc71adede5b122359
          path: .producer/wp-codebox
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: rhysd/actionlint@v1.7.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DOCS_AGENT_DIR: ${{ github.workspace }}/.producer/docs-agent
          WP_CODEBOX_DIR: ${{ github.workspace }}/.producer/wp-codebox
      - run: pnpm build
      - run: pnpm verify
